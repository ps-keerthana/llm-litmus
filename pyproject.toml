[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-litmus"
version = "1.0.0"
description = "A CI quality gate and evaluation pipeline for RAG systems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Sai Keerthana" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "groq>=0.11",
    "sentence-transformers>=2.2",
    "chromadb>=0.4",
    "python-dotenv>=1.0",
    "numpy>=1.24",
    "fastapi>=0.100",
    "uvicorn>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "httpx>=0.27",
]
dashboard = [
    "streamlit>=1.30",
    "pandas>=2.0",
    "plotly>=5.15",
]
providers = [
    "openai>=1.0",
    "anthropic>=0.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning:chromadb",
    "ignore::DeprecationWarning:sentence_transformers",
    "ignore::UserWarning:torch",
]
