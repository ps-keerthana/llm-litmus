[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "litmus_v2"
version = "2.0.0"
description = "Evaluate the Evaluator: Statistically Rigorous RAG Evaluation Framework"
authors = [{ name = "Litmus Team" }]
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["data", "retrieval", "generation", "graders", "perturbations", "metaeval", "stats", "gate", "report", "labeling"]
omit = ["tests/*"]
